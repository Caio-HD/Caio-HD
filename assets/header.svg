<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-label="Caio Dias, Full Stack Developer and AI Agents">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#05080F"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#14B8A6"/>
      <stop offset="1" stop-color="#3B82F6"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#1E293B"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .t { font-family: 'Segoe UI', Inter, Helvetica, Arial, sans-serif; }
      .node { fill: #14B8A6; animation: pulse 3s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .n2 { animation-delay: .6s } .n3 { animation-delay: 1.2s } .n4 { animation-delay: 1.8s } .n5 { animation-delay: 2.4s }
      .link { stroke: #14B8A6; stroke-opacity: .35; stroke-width: 1.4; stroke-dasharray: 6 6; animation: flow 4s linear infinite; }
      .core { animation: breathe 4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .cursor { animation: blink 1.1s step-end infinite; }
      @keyframes pulse { 0%,100% { opacity: .45; transform: scale(1) } 50% { opacity: 1; transform: scale(1.35) } }
      @keyframes flow { to { stroke-dashoffset: -48 } }
      @keyframes breathe { 0%,100% { opacity: .75 } 50% { opacity: 1 } }
      @keyframes blink { 50% { opacity: 0 } }
    </style>
  </defs>

  <rect width="1200" height="280" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="280" rx="16" fill="url(#dots)"/>
  <path d="M0 40 H160 L200 80 H330" stroke="#14B8A6" stroke-opacity=".25" fill="none"/>
  <path d="M1200 250 H1040 L1000 210 H880" stroke="#3B82F6" stroke-opacity=".25" fill="none"/>

  <!-- agent network -->
  <g transform="translate(910 140)">
    <line class="link" x1="0" y1="0" x2="-110" y2="-70"/>
    <line class="link" x1="0" y1="0" x2="120" y2="-60"/>
    <line class="link" x1="0" y1="0" x2="140" y2="55"/>
    <line class="link" x1="0" y1="0" x2="-120" y2="65"/>
    <line class="link" x1="0" y1="0" x2="10" y2="-105"/>
    <line class="link" x1="-110" y1="-70" x2="10" y2="-105"/>
    <line class="link" x1="120" y1="-60" x2="140" y2="55"/>
    <circle class="node" cx="-110" cy="-70" r="6" filter="url(#glow)"/>
    <circle class="node n2" cx="120" cy="-60" r="6" filter="url(#glow)"/>
    <circle class="node n3" cx="140" cy="55" r="6" filter="url(#glow)"/>
    <circle class="node n4" cx="-120" cy="65" r="6" filter="url(#glow)"/>
    <circle class="node n5" cx="10" cy="-105" r="6" filter="url(#glow)"/>
    <g class="core">
      <rect x="-38" y="-38" width="76" height="76" rx="16" fill="#0F1B2D" stroke="url(#accent)" stroke-width="2" filter="url(#glow)"/>
      <text x="0" y="9" text-anchor="middle" class="t" font-size="26" font-weight="700" fill="#5EEAD4">AI</text>
    </g>
  </g>

  <!-- text -->
  <text x="64" y="112" class="t" font-size="58" font-weight="700" fill="#F8FAFC">Caio Dias</text>
  <text x="66" y="156" class="t" font-size="24" font-weight="600" fill="#F8FAFC">Full Stack Developer <tspan fill="#5EEAD4">· AI Agents</tspan></text>
  <rect x="66" y="174" width="420" height="2" rx="1" fill="url(#accent)"/>
  <text x="66" y="208" class="t" font-size="17" fill="#94A3B8">TypeScript · JavaScript · React · Node.js · PostgreSQL · Docker</text>
  <text x="66" y="240" class="t" font-size="15" fill="#64748B">São Paulo, Brazil · UTC-3 · open to remote<tspan class="cursor" fill="#5EEAD4"> ▍</tspan></text>
</svg>
