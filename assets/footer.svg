<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="70" viewBox="0 0 1200 70" role="img" aria-label="Thanks for visiting">
  <defs>
    <linearGradient id="a" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#14B8A6" stop-opacity="0"/>
      <stop offset=".5" stop-color="#14B8A6"/>
      <stop offset="1" stop-color="#3B82F6" stop-opacity="0"/>
    </linearGradient>
    <style>
      .t { font-family: 'Segoe UI', Inter, Helvetica, Arial, sans-serif; }
      .scan { animation: scan 5s linear infinite; }
      @keyframes scan { from { transform: translateX(-400px) } to { transform: translateX(1200px) } }
    </style>
  </defs>
  <rect width="1200" height="70" rx="12" fill="#0B1220"/>
  <rect y="0" width="1200" height="2" fill="#1E293B"/>
  <rect class="scan" y="0" width="400" height="2" fill="url(#a)"/>
  <text x="600" y="43" text-anchor="middle" class="t" font-size="16" fill="#94A3B8">Thanks for stopping by · <tspan fill="#5EEAD4">let's build something together</tspan></text>
</svg>
